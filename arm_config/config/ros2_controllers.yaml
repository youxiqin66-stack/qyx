# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # 实机串口硬件接口较慢，先把 ros2_control 主循环降到 15Hz，
    # 与 servo.yaml 中 publish_period=0.10 基本对齐，避免新命令堆积。
    update_rate: 15  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

arm_velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity
