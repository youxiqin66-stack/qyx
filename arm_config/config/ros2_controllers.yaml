# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    # ros2_control 主循环 15Hz，与 servo.yaml publish_period=0.10（10Hz）、visual_servo 100ms（10Hz）对齐。
    # read+write 单周期估算 ~25~35ms < 66.7ms；若实测出现超周期/丢命令警告，退回 10Hz。
    update_rate: 15  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

arm_velocity_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    interface_name: velocity
